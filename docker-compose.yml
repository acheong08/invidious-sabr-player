version: '3.8'

services:
  kira:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      # Optional: Override any build-time settings here if needed
      - NODE_ENV=production
    restart: unless-stopped

